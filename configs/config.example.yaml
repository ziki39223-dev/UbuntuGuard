# UbuntuGuard configuration example.
# Copy to /etc/ubuntuguard/config.yaml and adjust.
# Schema: docs/TECHNICAL_DESIGN.md

version: 1

general:
  log_level: info
  log_dir: /var/log/ubuntuguard
  state_dir: /var/lib/ubuntuguard
  timeout_seconds: 30

audit:
  fail_on: high
  include: [ssh, users, firewall, sysctl, permissions, ports]
  engine: native

harden:
  require_confirmation: true
  backup_before_change: true
  verify_after_apply: true
  rollback_on_failure: true

ssh:
  port: 22
  permit_root_login: prohibit-password
  password_authentication: false
  allow_users: []

firewall:
  enabled: true
  default_incoming: deny
  allow_ports: ["22/tcp"]

fail2ban:
  enabled: true
  maxretry: 5
  bantime: 1h

sysctl:
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.tcp_syncookies: 1
  net.ipv6.conf.all.disable_ipv6: 0

monitoring:
  thresholds:
    cpu_percent: 85
    memory_percent: 85
    disk_percent: 85
    load_per_core: 1.5
  disk_mounts: ["/"]
  services: [ssh]
  node_exporter:
    enabled: false
    url: "http://127.0.0.1:9100/metrics"
  webhook:
    enabled: false
    url: ""
    timeout_seconds: 5

backup:
  dir: /var/lib/ubuntuguard/backups
  compress: true
  retention_days: 30
  retention_count: 20

notifications:
  retry: 2
  retry_interval_seconds: 3
