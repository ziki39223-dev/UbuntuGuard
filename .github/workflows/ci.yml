name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Build deb
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts dh-python pybuild-plugin-pyproject
          chmod +x debian/rules debian/postinst debian/prerm debian/postrm
          chmod -x debian/install systemd/*
          dpkg-buildpackage -us -uc -b
      - name: Smoke test deb
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo dpkg -i ../ubuntuguard_*_all.deb || sudo apt-get -f install -y
          ubuntuguard --version
          ubuntuguard config validate
