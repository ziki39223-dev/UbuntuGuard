name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Build deb
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts dh-python pybuild-plugin-pyproject build-essential python3-all python3-setuptools
          chmod +x debian/rules debian/postinst debian/prerm debian/postrm
          chmod -x debian/install systemd/*
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          dpkg-buildpackage -us -uc -b
      - name: Smoke test deb
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo dpkg -i ../ubuntuguard_*_all.deb || sudo apt-get -f install -y
          ubuntuguard --version
          ubuntuguard config validate

  apt-repo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts dh-python pybuild-plugin-pyproject \
            build-essential python3-all python3-setuptools apt-utils gnupg
      - name: Build deb
        run: |
          chmod +x debian/rules debian/postinst debian/prerm debian/postrm
          chmod -x debian/install systemd/*
          dpkg-buildpackage -us -uc -b
      - name: Generate ephemeral signing key
        run: |
          gpg --batch --gen-key <<'EOF'
          Key-Type: RSA
          Key-Length: 3072
          Key-Usage: sign
          Name-Real: UbuntuGuard CI
          Name-Email: ci@ubuntuguard.local
          Expire-Date: 1d
          %no-protection
          %commit
          EOF
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          echo "GPG_KEY_ID=$fpr" >> "$GITHUB_ENV"
      - name: Build signed apt repository
        run: |
          chmod +x scripts/build-apt-repo.sh
          scripts/build-apt-repo.sh --pool .. --out "$PWD/apt-repo"
          gpg --verify apt-repo/dists/noble/Release.gpg apt-repo/dists/noble/Release
      - name: Install from signed repository
        run: |
          sudo install -m 0644 apt-repo/ubuntuguard-archive-keyring.gpg /usr/share/keyrings/ubuntuguard-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/ubuntuguard-archive-keyring.gpg] file:$PWD/apt-repo noble main" | sudo tee /etc/apt/sources.list.d/ubuntuguard.list
          sudo apt-get update
          sudo apt-get install -y ubuntuguard
          ubuntuguard --version

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts dh-python pybuild-plugin-pyproject \
            build-essential python3-all python3-setuptools \
            ufw auditd aide openssh-server jq
      - name: Build deb
        run: |
          chmod +x debian/rules debian/postinst debian/prerm debian/postrm
          chmod -x debian/install systemd/*
          dpkg-buildpackage -us -uc -b
      - name: Install deb
        run: sudo dpkg -i ../ubuntuguard_*_all.deb || sudo apt-get -f install -y
      - name: Enable services
        run: |
          sudo systemctl enable --now auditd
          sudo systemctl enable --now ssh
          systemctl is-active auditd ssh
      - name: Run integration test
        run: sudo env OUT_DIR="$PWD/integration-out" REQUIRE_AUDITD=1 bash scripts/integration-test.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: integration-out/
          if-no-files-found: ignore
